[package]
name = "joblens"
version = "0.1.0"
description = "Private remote job finder"
authors = ["FaithDevs"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "joblens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
ts-rs = "12.0.1"
pdf-extract = "0.12.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
regex = "1.13.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "gzip"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["time", "sync"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind, not abort: PDF parsing panics are caught so a bad file can't crash the app.
panic = "unwind"
strip = true

# Regex matching runs over every job description on each feed load; keep it fast in dev builds.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[dev-dependencies]
lopdf = "0.42"
tempfile = "3.27.0"
